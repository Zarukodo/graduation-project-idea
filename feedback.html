<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提問與回饋</title>
    <style>
        body {
            background-color: #424874;
            color: #d6e5e3;
            font-family: 'Noto Serif TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background: rgba(214, 229, 227, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(166, 177, 225, 0.25);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #dcd6f7; letter-spacing: 2px; text-align: center; }
        input, textarea {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(166, 177, 225, 0.4);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: none; height: 100px; }
        button {
            width: 100%;
            background: linear-gradient(135deg, #a6b1e1, #dcd6f7);
            color: #424874;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>發送回饋給團隊</h2>
        <input type="text" id="author" placeholder="您的稱呼 (選填)">
        <textarea id="message" placeholder="請問有什麼建議或問題嗎？"></textarea>
        <button id="submitBtn">發送至QA頁面</button>
    </div>

    <script>
    // 乾淨俐落，不用再引入又肥又大的 Firebase SDK 了！
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const authorVal = document.getElementById('author').value.trim() || '匿名聽眾';
        const messageVal = document.getElementById('message').value.trim();

        if (!messageVal) {
            alert("總得寫點什麼吧！");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = '發送中...';

        try {
            // 改成打你的 Node.js API 
            // 開發期可能是 http://localhost:3000/api/submit-feedback
            const response = await fetch('https://graduation-project-idea.onrender.com/api/submit-feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    author: authorVal,
                    message: messageVal
                })
            });

            if (response.ok) {
                alert("發送成功！請看QA頁面。");
                document.getElementById('message').value = ''; 
            } else if (response.status === 429) {
                alert("你點太快啦！請稍後再試。");
            } else {
                throw new Error('伺服器拒絕請求');
            }
        } catch (error) {
            console.error("發送失敗", error);
            alert("糟糕，連線到伺服器失敗了。");
        } finally {
            btn.disabled = false;
            btn.innerText = '發送至QA頁面';
        }
    });
</script>
</body>
</html>
